services:
  # Contenedor 1: La Base de Datos
  servidor_db_2:
    image: mysql:8.0
    container_name: mysql_bd_2
    restart: always
    # Pasamos el archivo .env directamente para mayor seguridad
    env_file:
      - .env
    ports:
      - "3308:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql # Inyección del script inicial
    healthcheck:
      # "healthy" = MySQL ya acepta conexiones por red, no solo que el contenedor arrancó.
      # Se usa 127.0.0.1 (TCP) a propósito: mientras corre init.sql, MySQL levanta un
      # servidor temporal que solo escucha por socket, y con "localhost" pasaría antes de tiempo.
      # $$ evita que Compose interprete la variable; la expande el shell del contenedor.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
      - red_erp

  # Contenedor 2: El Backend en Flask
  api_backend:
    build: ./backend  # Le decimos que construya la imagen usando el Dockerfile
    container_name: backend_flask
    restart: always
    env_file:
      - .env
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app  # Volumen sincronizado: lo que edites en tu PC, se actualiza en el contenedor
    depends_on:
      servidor_db_2:
        condition: service_healthy  # Flask arranca cuando MySQL ya acepta conexiones
    networks:
      - red_erp

  # Contenedor 3: El Frontend Web (Nginx)
  frontend_web:
    build: ./frontend
    container_name: frontend_erp
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api_backend
    networks:
      - red_erp

volumes:
  datos_mysql:

# Red común: los contenedores se encuentran por el nombre de su servicio
networks:
  red_erp:
    driver: bridge
